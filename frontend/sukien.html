<section class="page-header">
  <h1>Sự Kiện & Khuyến Mãi</h1>
</section>
<section class="events-page">
  <!-- Filter tabs -->
  <div class="filter-tabs">
    <button class="tab active" onclick="filterEvents('all', this)">Tất cả</button>
    <button class="tab" onclick="filterEvents('SuKien', this)">Sự Kiện</button>
    <button class="tab" onclick="filterEvents('KhuyenMai', this)">Khuyến Mãi</button>
  </div>
  <!-- Grid sự kiện -->
  <div id="allEvents" class="all-events-grid"></div>
</section>
<script src="js/app.js"></script>
<script>
  async function loadAllEvents(filter = "all") {
    const url = filter === "all" ? `${API_URL}/SuKien`
      : `${API_URL}/SuKien?loai=${filter}`;
    const res = await fetch(url);
    const events = await res.json();
    document.getElementById("allEvents").innerHTML = events.map(ev => `
      <div class="event-full-card">
        <div class="event-badge ${ev.loaiTin === "KhuyenMai" ? "badge-red" : "badge-blue"}">
          ${ev.loaiTin}
        </div>
        <h3>${ev.tieuDe}</h3>
        <p>${ev.moTa}</p>
        <p class="date-range">
          📅 ${formatDate(ev.ngayBatDau)} — ${formatDate(ev.ngayKetThuc)}
        </p>
      </div>`).join("");
  }
  function filterEvents(type, btn) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    loadAllEvents(type);
  }
  document.addEventListener("DOMContentLoaded", () => loadAllEvents());
</script>
